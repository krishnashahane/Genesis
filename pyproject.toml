[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-os"
version = "0.2.0"
description = "A modular runtime and memory kernel for autonomous AI agent systems."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "structlog>=25,<26",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]
full = [
  "langgraph>=0.2,<2",
  "chromadb>=0.6,<2",
  "redis>=5,<8",
  "anthropic>=0.79,<1",
  "google-genai>=1.30,<2",
]

[project.scripts]
genesis = "genesis.__main__:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
