[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-os"
version = "0.1.1"
description = "Runtime and memory operating system for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna" }]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "structlog>=24.1,<26",
  "tenacity>=8.2,<10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.3,<1",
  "mypy>=1.9,<2"
]
full = [
  "langgraph>=0.2,<2",
  "chromadb>=0.5,<2",
  "redis>=5,<8",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg>=0.29,<1",
  "anthropic>=0.25,<1",
  "google-genai>=1.0,<2"
]

[project.scripts]
genesis = "genesis.__main__:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
